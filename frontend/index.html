<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="&#32593;&#30424;&#33258;&#21160;&#36716;&#23384;&#24037;&#20855; - &#39640;&#25928;&#31649;&#29702;&#20320;&#30340;&#32593;&#30424;&#36164;&#28304;">
  <meta name="keywords" content="&#32593;&#30424;,&#33258;&#21160;&#36716;&#23384;,&#32593;&#30424;&#31649;&#29702;,&#36164;&#28304;&#19979;&#36733;">
  <meta name="author" content="&#32593;&#30424;&#33258;&#21160;&#36716;&#23384;&#24037;&#20855;">
  <meta name="cloudflare-rocket-loader" content="off">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="//pan.baidu.com">
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">

  <title>&#32593;&#30424;&#33258;&#21160;&#36716;&#23384;&#24037;&#20855;</title>

  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e1e1e1;
      border-top: 4px solid #409eff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      color: #666;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-hidden {
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">&#27491;&#22312;&#21152;&#36733;...</div>
  </div>

  <div id="app"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const loadingEl = document.getElementById('app-loading');
        if (loadingEl) {
          loadingEl.classList.add('loading-hidden');
          setTimeout(function() {
            loadingEl.style.display = 'none';
          }, 300);
        }
      }, 1000);
    });

    window.addEventListener('error', function(e) {
      if (!e.error ||
          (e.filename && e.filename.includes('rocket-loader')) ||
          (e.target && e.target.src && e.target.src.includes('cloudflare'))) {
        return;
      }
      console.error('Application error:', e.error);
    });

    window.addEventListener('unhandledrejection', function(e) {
      if (e.reason) {
        console.error('Unhandled promise rejection:', e.reason);
      }
    });
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
