name: Manual Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (for example: v1.0.0); defaults to package.json'
        required: false
        type: string
        default: 'test'
      push_to_registry:
        description: 'Push to Docker Hub'
        required: true
        type: boolean
        default: true
      update_latest:
        description: 'Also update the latest tag'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/network-autosave

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using user-specified version: $VERSION"
          else
            VERSION="v$(jq -r '.version' frontend/package.json)"
            echo "Using version from package.json: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub
        if: inputs.push_to_registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ inputs.update_latest }}

      - name: Add additional tags
        id: additional_tags
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          if [ -n "${{ inputs.docker_tags }}" ]; then
            IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.docker_tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              tag=$(echo "$tag" | xargs)
              if [ "$tag" != "${{ env.VERSION }}" ]; then
                TAGS="$TAGS,${{ env.IMAGE_NAME }}:$tag"
              fi
            done
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Display build information
        run: |
          echo "Building Docker image"
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Version: ${{ env.VERSION }}"
          echo "Additional tags: ${{ inputs.docker_tags }}"
          echo "Update latest: ${{ inputs.update_latest }}"
          echo "Push to registry: ${{ inputs.push_to_registry }}"
          echo "Tags: ${{ steps.additional_tags.outputs.tags }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push_to_registry }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.additional_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
